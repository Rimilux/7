<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <button id="profile-btn" class="nav-btn">
                <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path></svg>
                <span>Profile</span>
            </button>
            <button id="tasks-btn" class="nav-btn">
                <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"></path></svg>
                <span>Tasks</span>
            </button>
            <button id="tickets-btn" class="nav-btn">
                <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M22 10V6c0-1.1-.9-2-2-2H4c-1.1 0-1.99.9-1.99 2v4c1.1 0 2 .9 2 2s-.9 2-2 2v4c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-4c-1.1 0-2-.9-2-2s.9-2 2-2zm-9 7H4v-2h9v2zm0-4H4v-2h9v2zm0-4H4V7h9v2z"></path></svg>
                <span>Tickets</span>
            </button>
        </nav>
    </header>

    <main>
        <section id="profile-section">
            <h2>Profile</h2>
            <p>Coins: <span id="coin-balance">0</span></p>
            <h3>Your Tickets</h3>
            <ul id="user-tickets"></ul>
        </section>

        <section id="tasks-section" class="hidden">
            <h2>Tasks</h2>
            <div class="task-list">
                <div class="task" data-reward="10">
                    <p>Task 1: Watch a video</p>
                    <button class="complete-task-btn">Earn 10 Coins</button>
                </div>
                <div class="task" data-reward="20">
                    <p>Task 2: Share on social media</p>
                    <button class="complete-task-btn">Earn 20 Coins</button>
                </div>
            </div>
        </section>

        <section id="tickets-section" class="hidden">
            <h2>Tickets</h2>
            <p>Click on a ticket to buy it. Price: <strong id="ticket-price-display">50</strong> Coins.</p>
            <div id="ticket-grid" class="ticket-grid-container">
                <!-- Tickets will be dynamically generated here -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
