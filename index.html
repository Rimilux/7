<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <button id="profile-btn">Profile</button>
            <button id="tasks-btn">Tasks</button>
            <button id="tickets-btn">Tickets</button>
        </nav>
    </header>

    <main>
        <section id="profile-section">
            <h2>Profile</h2>
            <p>Coins: <span id="coin-balance">0</span></p>
            <h3>Your Tickets</h3>
            <ul id="user-tickets"></ul>
        </section>

        <section id="tasks-section" class="hidden">
            <h2>Tasks</h2>
            <div class="task-list">
                <div class="task" data-reward="10">
                    <p>Task 1: Watch a video</p>
                    <button class="complete-task-btn">Earn 10 Coins</button>
                </div>
                <div class="task" data-reward="20">
                    <p>Task 2: Share on social media</p>
                    <button class="complete-task-btn">Earn 20 Coins</button>
                </div>
            </div>
        </section>

        <section id="tickets-section" class="hidden">
            <h2>Tickets</h2>
            <p>Click on a ticket to buy it. Price: <strong id="ticket-price-display">50</strong> Coins.</p>
            <div id="ticket-grid" class="ticket-grid-container">
                <!-- Tickets will be dynamically generated here -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
